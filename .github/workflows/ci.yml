name: ci
on:
  pull_request:
  # A new org gates pull_request-triggered runs (they queue with zero jobs), so
  # CI also runs on any pushed branch and can be dispatched by hand.
  push:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
